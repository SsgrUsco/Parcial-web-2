<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso denegado</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page">
    <section class="hero compact">
        <div class="eyebrow">Autorizacion</div>
        <h1>No tienes permisos para esta accion</h1>
        <p class="lead">Tu cuenta puede ingresar al sistema, pero esta operacion esta restringida al rol correspondiente o a recursos que no te pertenecen.</p>
        <div class="actions">
            <a class="btn btn-primary" th:href="@{/inicio}">Volver a mi panel</a>
            <form th:action="@{/logout}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit" class="btn btn-secondary">Cerrar sesion</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
