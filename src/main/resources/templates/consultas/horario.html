<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualizar horario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page">
    <section class="hero compact">
        <div class="eyebrow">Paciente</div>
        <h1>Actualizar horario de la cita</h1>
        <p class="lead">Solo puedes modificar el horario de las citas que tienes asignadas.</p>
    </section>
    <section class="panel">
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <div class="subject-card">
            <h2 th:text="${consulta.nombrePaciente}">Paciente</h2>
            <p><strong>Motivo:</strong> <span th:text="${consulta.motivoConsulta}">Control</span></p>
            <p><strong>Medico:</strong> <span th:text="${consulta.medico.nombreCompleto}">Medico</span></p>
            <p><strong>Consultorio:</strong> <span th:text="${consulta.numeroConsultorio}">5</span></p>
        </div>

        <form th:action="@{'/paciente/consultas/' + ${consulta.id} + '/horario'}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <div class="time-grid">
                <label>
                    Hora de inicio
                    <input type="time" name="horaInicio" th:value="${#temporals.format(consulta.horaInicio, 'HH:mm')}" required>
                </label>
                <label>
                    Hora de finalizacion
                    <input type="time" name="horaFin" th:value="${#temporals.format(consulta.horaFin, 'HH:mm')}" required>
                </label>
            </div>
            <div class="actions">
                <button type="submit" class="btn btn-primary">Actualizar horario</button>
                <a class="btn btn-secondary" th:href="@{/paciente/consultas}">Volver</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
