<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${titulo}">Consulta</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<main class="page">
    <section class="hero compact">
        <div class="eyebrow">Administrador</div>
        <h1 th:text="${titulo}">Consulta medica</h1>
        <p class="lead">Registra paciente, motivo de consulta, consultorio, horario y medico encargado.</p>
    </section>

    <section class="panel">
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="${action}" th:object="${consulta}" method="post" class="form-grid">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label>
                Paciente
                <select name="pacienteId" required>
                    <option value="">Selecciona un paciente</option>
                    <option th:each="paciente : ${pacientes}"
                            th:value="${paciente.id}"
                            th:selected="${consulta.paciente != null and consulta.paciente.id == paciente.id}"
                            th:text="${paciente.nombreCompleto}">
                    </option>
                </select>
            </label>

            <label>
                Motivo de la consulta
                <textarea th:field="*{motivoConsulta}" maxlength="100" rows="4" required></textarea>
                <small class="field-error" th:if="${#fields.hasErrors('motivoConsulta')}" th:errors="*{motivoConsulta}"></small>
            </label>

            <label>
                Numero de consultorio
                <input type="number" th:field="*{numeroConsultorio}" min="1" required>
                <small class="field-error" th:if="${#fields.hasErrors('numeroConsultorio')}" th:errors="*{numeroConsultorio}"></small>
            </label>

            <div class="time-grid">
                <label>
                    Hora de inicio
                    <input type="time" th:field="*{horaInicio}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('horaInicio')}" th:errors="*{horaInicio}"></small>
                </label>
                <label>
                    Hora de finalizacion
                    <input type="time" th:field="*{horaFin}" required>
                    <small class="field-error" th:if="${#fields.hasErrors('horaFin')}" th:errors="*{horaFin}"></small>
                </label>
            </div>

            <label>
                Medico
                <select name="medicoId" required>
                    <option value="">Selecciona un medico</option>
                    <option th:each="medico : ${medicos}"
                            th:value="${medico.id}"
                            th:selected="${consulta.medico != null and consulta.medico.id == medico.id}"
                            th:text="${medico.nombreCompleto}">
                    </option>
                </select>
            </label>

            <div class="actions">
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a class="btn btn-secondary" th:href="@{/admin/consultas}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
